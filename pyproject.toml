[project]
name = "hc-vision-api"
version = "0.1.0"
description = "CPU inference API compatible with the existing Roboflow HTTP client"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "numpy>=1.26,<3",
    "opencv-python>=4.10,<6",
    "pydantic>=2.9,<3",
    "ultralytics>=8.3",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<10", "ruff>=0.9"]

[project.scripts]
hc-vision-api = "hc_vision_api.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hc_vision_api"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

